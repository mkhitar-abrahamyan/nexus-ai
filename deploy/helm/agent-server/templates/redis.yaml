{{- $fullname := include "agent-server.fullname" . -}}
{{- if and (not .Values.redis.existingSecret) (or .Values.redis.deploy .Values.redis.url) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "agent-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  redis-url: {{ .Values.redis.url | default (printf "redis://%s-redis:6379" $fullname) | quote }}
{{- end }}
{{- if .Values.redis.deploy }}
---
# A single Redis for trying the release out. Set redis.deploy=false and point redis.url at a managed
# or replicated Redis in production.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}-redis
  labels:
    {{- include "agent-server.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  serviceName: {{ $fullname }}-redis
  replicas: 1
  selector:
    matchLabels:
      {{- include "agent-server.selector" (dict "root" . "component" "redis") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agent-server.selector" (dict "root" . "component" "redis") | nindent 8 }}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--appendonly", "yes"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.redis.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-redis
  labels:
    {{- include "agent-server.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  selector:
    {{- include "agent-server.selector" (dict "root" . "component" "redis") | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
{{- end }}
