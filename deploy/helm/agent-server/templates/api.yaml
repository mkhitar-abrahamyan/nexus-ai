apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-server.fullname" . }}-api
  labels:
    {{- include "agent-server.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "agent-server.selector" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agent-server.selector" (dict "root" . "component" "api") | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        # The node user in the image; a numeric id is what lets the kubelet verify it is not root.
        runAsUser: 1000
        runAsGroup: 1000
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: server
          {{- include "agent-server.container" . | nindent 10 }}
          env:
            - name: ROLE
              value: api
            - name: CANARY_GUARD
              value: {{ .Values.api.canaryGuard | quote }}
            {{- with .Values.api.canarySteps }}
            - name: CANARY_STEPS
              value: {{ . | quote }}
            {{- end }}
            {{- include "agent-server.commonEnv" . | nindent 12 }}
            {{- range $name, $value := .Values.api.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          lifecycle:
            # Give the endpoints a moment to drop the pod before SIGTERM starts the drain.
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agent-server.fullname" . }}-api
  labels:
    {{- include "agent-server.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "agent-server.selector" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
{{- if .Values.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "agent-server.fullname" . }}-api
  labels:
    {{- include "agent-server.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "agent-server.selector" (dict "root" . "component" "api") | nindent 6 }}
{{- end }}
