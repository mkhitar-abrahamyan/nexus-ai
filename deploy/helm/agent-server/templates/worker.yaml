apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-server.fullname" . }}-worker
  labels:
    {{- include "agent-server.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  {{- if eq .Values.autoscaling.mode "none" }}
  replicas: {{ .Values.worker.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "agent-server.selector" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agent-server.selector" (dict "root" . "component" "worker") | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        # The node user in the image; a numeric id is what lets the kubelet verify it is not root.
        runAsUser: 1000
        runAsGroup: 1000
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: server
          {{- include "agent-server.container" . | nindent 10 }}
          env:
            - name: ROLE
              value: worker
            - name: CONCURRENCY
              value: {{ .Values.worker.concurrency | quote }}
            - name: DRAIN_TIMEOUT_MS
              value: {{ .Values.worker.drainTimeoutMs | quote }}
            {{- include "agent-server.commonEnv" . | nindent 12 }}
            {{- range $name, $value := .Values.worker.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if .Values.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "agent-server.fullname" . }}-worker
  labels:
    {{- include "agent-server.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "agent-server.selector" (dict "root" . "component" "worker") | nindent 6 }}
{{- end }}
