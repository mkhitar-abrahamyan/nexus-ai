# Fronts the replicas. The settings that matter are the ones that leave an event stream alone:
# no response buffering, no read timeout, and HTTP/1.1 so the connection stays open.
upstream agent_servers {
  server server:8080;
}

server {
  listen 8080;

  location / {
    proxy_pass http://agent_servers;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;

    # Server-sent events: send each chunk straight through and never time the stream out.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    chunked_transfer_encoding on;
  }
}
