# Two replicas of the agent server behind one Redis, which is what makes them one server:
# threads and runs are shared state, a run whose replica dies is finished by the other, and an event
# stream reconnects to whichever replica answers.
#
#   docker compose -f deploy/compose.yaml up --build --scale server=2
#
# Then kill a replica mid-run (`docker compose kill --signal SIGKILL server`) and watch the run
# finish anyway: the lease lapses, the surviving replica claims it, and the client's event stream
# resumes from the last id it saw.
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      # Read by the server module to build its Redis-backed stores.
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      PORT: 8080
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "8080"
    deploy:
      replicas: 2
    restart: unless-stopped

  # One address in front of both replicas, so a client reconnecting can land on either.
  gateway:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server

volumes:
  redis-data:
