# An API tier and a worker pool behind one Redis, which is what makes them one server: threads, runs,
# events, and the queue are shared, a run whose worker dies is finished by another, and an event
# stream reconnects to whichever API replica answers.
#
#   docker compose -f deploy/compose.yaml up --build --scale worker=3
#
# Then kill a worker mid-run (`docker compose -f deploy/compose.yaml kill --signal SIGKILL worker`) and
# watch the run finish anyway: its lease lapses and another worker takes it over. Stop one gracefully
# (`docker compose stop worker`) and it drains instead, handing its runs to the others at once.
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Accepts runs and queues them; serves reads, event streams, and deployments.
  api:
    build: ./app
    environment:
      ROLE: api
      REDIS_URL: redis://redis:6379
      CANARY_GUARD: "true"
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "8080"
    deploy:
      replicas: 2
    stop_grace_period: 30s
    restart: unless-stopped

  # Claims queued runs, CONCURRENCY at a time. Scale this one with the queue.
  worker:
    build: ./app
    environment:
      ROLE: worker
      REDIS_URL: redis://redis:6379
      CONCURRENCY: "4"
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      replicas: 2
    stop_grace_period: 30s
    restart: unless-stopped

  # One address in front of the API replicas, so a client reconnecting can land on either.
  gateway:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  redis-data:
