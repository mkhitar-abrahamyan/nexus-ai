# A single Redis for trying the deployment out. In production, point REDIS_URL at a managed or
# replicated Redis instead and leave this file out of kustomization.yaml.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: agent-server-redis
  labels:
    app.kubernetes.io/name: agent-server
    app.kubernetes.io/component: redis
spec:
  serviceName: agent-server-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-server
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-server
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--appendonly", "yes"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: agent-server-redis
  labels:
    app.kubernetes.io/name: agent-server
    app.kubernetes.io/component: redis
spec:
  selector:
    app.kubernetes.io/name: agent-server
    app.kubernetes.io/component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
