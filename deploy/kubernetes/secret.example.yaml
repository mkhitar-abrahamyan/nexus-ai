# The settings the servers read from a Secret. Copy to secret.yaml, fill in, and apply it first:
#
#   kubectl apply -f deploy/kubernetes/secret.yaml
#
# Leave server-token out to serve without authentication, which suits a private cluster only.
apiVersion: v1
kind: Secret
metadata:
  name: agent-server
type: Opaque
stringData:
  redis-url: redis://agent-server-redis:6379
  server-token: replace-with-a-long-random-token
