name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build, lint, test, type-check, and verify package
        run: npm run check:release

  kernel:
    # Node.js and an edge runtime run the kernel inside check:release; these are the other two.
    name: Portable kernel on ${{ matrix.runtime }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [deno, bun]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 22 to build
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and build
        run: npm ci && npm run build

      - name: Use Deno
        if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Use Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2

      - name: Run the kernel tests on Deno
        if: matrix.runtime == 'deno'
        run: deno run --allow-read tests/portable/run.mjs deno

      - name: Run the kernel tests on Bun
        if: matrix.runtime == 'bun'
        run: bun tests/portable/run.mjs bun
