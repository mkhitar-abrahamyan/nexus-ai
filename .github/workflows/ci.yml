name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull the container images
        run: |
          docker pull node:22-alpine
          docker pull otel/opentelemetry-collector:0.111.0
          docker pull ghcr.io/dexidp/dex:v2.46.0

      - name: Build, lint, test, type-check, and verify package
        run: npm run check:release
        env:
          # The container sandbox's proof, the OTLP collector's, and the studio's sign-in through Dex
          # run against the runner's Docker, and must not be skipped.
          NEXUS_REQUIRE_CONTAINER: '1'

  kernel:
    # Node.js, an edge runtime, and headless Chromium run the kernel inside check:release; these are the
    # other runtimes, and the other two browser engines.
    name: Portable kernel on ${{ matrix.runtime }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [deno, bun, firefox, webkit]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 22 to build
        uses: actions/setup-node@v6
        with:
          node-version: 22
          check-latest: true
          cache: npm

      - name: Install dependencies and build
        run: npm ci && npm run build

      - name: Use Deno
        if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Use Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2

      - name: Run the kernel tests on Deno
        if: matrix.runtime == 'deno'
        run: deno run --allow-read tests/portable/run.mjs deno

      - name: Run the kernel tests on Bun
        if: matrix.runtime == 'bun'
        run: bun tests/portable/run.mjs bun

      - name: Install ${{ matrix.runtime }}
        if: matrix.runtime == 'firefox' || matrix.runtime == 'webkit'
        run: npx playwright-core install --with-deps ${{ matrix.runtime }}

      - name: Run the kernel tests in ${{ matrix.runtime }}
        if: matrix.runtime == 'firefox' || matrix.runtime == 'webkit'
        run: node tests/browser.mjs ${{ matrix.runtime }}
