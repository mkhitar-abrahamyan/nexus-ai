name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Use the trusted-publishing npm client
        run: npm install --global npm@11.14.0

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag
        run: node --eval "const version = require('./package.json').version; if (process.env.GITHUB_REF_NAME !== 'v' + version) throw new Error('Tag ' + process.env.GITHUB_REF_NAME + ' does not match package v' + version)"

      - name: Run release gates
        run: npm run check:release

      - name: Publish with provenance
        run: npm publish
